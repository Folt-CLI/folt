allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
too-many-lines-threshold = 100

disallowed-methods = [
    { path = "std::env::var", reason = "read the process environment only through config::env::Environment" },
    { path = "std::env::var_os", reason = "read the process environment only through config::env::Environment" },
    { path = "std::env::vars", reason = "read the process environment only through config::env::Environment" },
    { path = "std::env::vars_os", reason = "read the process environment only through config::env::Environment" },
    { path = "std::env::home_dir", reason = "read the OS home directory only through config::env::Environment" },
    { path = "std::env::current_dir", reason = "read the current directory only through config::env::Environment" },
    { path = "std::fs::write", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::rename", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::remove_file", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::remove_dir", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::remove_dir_all", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::create_dir", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::create_dir_all", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::copy", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::hard_link", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::set_permissions", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::File::create", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::File::create_new", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::File::set_len", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::File::set_permissions", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::File::set_modified", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::File::set_times", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::File::sync_all", reason = "perform file-system writes only through fsx" },
    { path = "std::fs::File::sync_data", reason = "perform file-system writes only through fsx" },
    { path = "std::os::unix::fs::symlink", reason = "perform file-system writes only through fsx" },
]
